name: Build Magnetar APK from ZIP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find and extract zip
        run: |
          ZIP=$(find . -maxdepth 2 -iname "*.zip" -not -path "./.git/*" | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "ERROR: repo mein koi .zip file nahi mili"
            ls -la
            exit 1
          fi
          echo "Zip mili: $ZIP"
          mkdir -p /tmp/extracted
          unzip -q "$ZIP" -d /tmp/extracted
          PKG=$(find /tmp/extracted -name package.json -not -path "*/node_modules/*" | head -n 1)
          if [ -z "$PKG" ]; then
            echo "ERROR: zip ke andar package.json nahi mili"
            exit 1
          fi
          APP_DIR=$(dirname "$PKG")
          echo "App folder: $APP_DIR"
          mkdir -p "$GITHUB_WORKSPACE/app"
          cp -a "$APP_DIR/." "$GITHUB_WORKSPACE/app/"
          ls -la "$GITHUB_WORKSPACE/app"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        working-directory: app
        run: npm install --legacy-peer-deps

      - name: Generate native Android project
        working-directory: app
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: app/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Magnetar-APK
          path: app/android/app/build/outputs/apk/release/app-release.apk
